name: GameLingoIOS
options:
  bundleIdPrefix: cz.caseycz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
targets:
  GameLingoIOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WebRTC
        product: WebRTC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GameLingo
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "Najde GameLingo TV v domácí síti a posílá do ní české titulky."
        UIRequiresPersistentWiFi: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.caseycz.gamelingo.ios
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
schemes:
  GameLingoIOS:
    build:
      targets:
        GameLingoIOS: all
    run:
      config: Debug
    archive:
      config: Release
