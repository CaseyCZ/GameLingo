name: GameLingoIOS
options:
  bundleIdPrefix: cz.caseycz
  developmentLanguage: cs
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_OBJC_BRIDGING_HEADER: App/PlayStation/GameLingoPSBridge.h
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/App/PlayStation"
      - "$(SRCROOT)/../../ps-core/ios/.build/iphoneos/include"
      - "$(SRCROOT)/../../ps-core/ios/.build/sources/mbedtls-2.28.0/include"
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/../../ps-core/ios/.build/iphoneos"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-lTPPlayCore"
      - "-lsqlite3"
      - "-framework"
      - "Security"
      - "-framework"
      - "CoreFoundation"
      - "-framework"
      - "SystemConfiguration"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 154.0.0
targets:
  GameLingoIOS:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WebRTC
        product: WebRTC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GameLingo
        CFBundleDevelopmentRegion: cs
        CFBundleLocalizations: [cs, en, sk]
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        NSLocalNetworkUsageDescription: "Najde GameLingo TV v domácí síti a posílá do ní české titulky."
        UIRequiresPersistentWiFi: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.caseycz.gamelingo.ios
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
schemes:
  GameLingoIOS:
    build:
      targets:
        GameLingoIOS: all
    run:
      config: Debug
    archive:
      config: Release
