    <linearGradient id="accent"><stop stop-color="#00c2f9"/><stop offset="1" stop-color="#b149fe"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="27" fill="url(#bg)" stroke="#34425f" stroke-width="2"/>
