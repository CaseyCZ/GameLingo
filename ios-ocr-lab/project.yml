name: IOSOCRLab
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64
targets:
  IOSOCRLab:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.caseycz.iosocrlab
        GENERATE_INFOPLIST_FILE: YES
  IOSOCRLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../mlkit-lab/app/src/androidTest/assets
        type: folder
        buildPhase: resources
    dependencies:
      - target: IOSOCRLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.caseycz.iosocrlab.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IOSOCRLab:
    build:
      targets:
        IOSOCRLab: all
        IOSOCRLabTests: [test]
    test:
      targets: [IOSOCRLabTests]
