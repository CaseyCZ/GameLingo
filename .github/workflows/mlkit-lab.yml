name: Android native OCR GTA VI trailer smoke test
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'mlkit-lab/**'
      - '.github/workflows/mlkit-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlkit-lab
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ocr-lab/requirements.txt
      - name: Install video decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python mlkit-lab/video_fixtures.py
        env:
          OCR_VIDEO_SOURCE: gta-vi-trailer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: sdkmanager --list_installed
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
        working-directory: mlkit-lab
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash mlkit-lab/run-combination.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlkit-android-results
          path: mlkit-lab/results/
          if-no-files-found: warn
          retention-days: 7
