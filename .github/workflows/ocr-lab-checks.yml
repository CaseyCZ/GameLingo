name: OCR Lab • isolated Windows checks
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'ocr-lab/**'
      - '.github/workflows/ocr-lab-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ocr-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-windows.txt
      - run: python -m unittest -v test_core test_translation_timing test_pipeline test_experiments
      - run: python -m py_compile core.py engines.py benchmark.py lab.py translation_timing.py prepare_model.py stabilizer.py latest_slot.py experiments.py
      - run: python -c "from winrt.windows.media.ocr import OcrEngine; print([x.language_tag for x in OcrEngine.available_recognizer_languages])"
      - run: python -c "import lab, benchmark, engines; from PIL import Image; assert engines.preprocess(Image.new('RGB',(100,40)),'contrast',75).size == (75,30)"
