name: Game profile validation
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'game-profiles/**'
      - '.github/workflows/game-profile-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python validate.py && python -m unittest -v test_profile
        working-directory: game-profiles
      - run: node test-calibrate.mjs
        working-directory: game-profiles
      - run: node test-holdout.mjs
        working-directory: game-profiles
      - run: node test-zone-scheduler.mjs
        working-directory: game-profiles
      - run: node test-block-pipeline.mjs
        working-directory: game-profiles
      - run: node test-automatic-session.mjs
        working-directory: game-profiles
