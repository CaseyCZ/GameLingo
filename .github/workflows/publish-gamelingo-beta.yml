name: Publish GameLingo 0.1.0 Beta 1

on:
  push:
    branches:
      - feature/gamelingo-v01-apps
    paths:
      - ".github/workflows/publish-gamelingo-beta.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify tested build and publish first GameLingo prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-beta.1"
          SOURCE="ef2116e585342dcde8c56599b225daf1a67a5eec"
          BUILD_RUN="45164944272"
          REPO="$GITHUB_REPOSITORY"
          RESULT=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')
          ACTUAL_SHA=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')
          test "$RESULT" = "success"
          test "$SOURCE" = "$ACTUAL_SHA"
          mkdir -p release
          gh run download "$BUILD_RUN" -R "$REPO" \
            -n "GameLingo-v0.1.0-beta.1-all-installers" -D release
          test -s release/GameLingo-iOS-v0.1.0-beta.1-unsigned.ipa
          test -s release/GameLingo-Android-v0.1.0-beta.1-TEST.apk
          test -s release/GameLingo-GoogleTV-v0.1.0-beta.1-TEST.apk
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release already exists, never overwrite published artifacts."
            exit 0
          fi
          cat > /tmp/gamelingo-release.md <<'EOF'
          ## GameLingo 0.1.0 — první testovací verze 🎮

          **GameLingo** je nová nezávislá aplikace s tmavě modrým vzhledem CaseyCZ, vlastním názvem a instalační identitou.

          ### Stažení
          - **iPhone:** GameLingo-iOS-v0.1.0-beta.1-unsigned.ipa – nepodepsaná IPA pro vlastní podpis a instalaci.
          - **Android telefon:** GameLingo-Android-v0.1.0-beta.1-TEST.apk – základ Android režimů převzatý z open-source PlayCaptionu, včetně jeho PlayStation Remote Play.
          - **Google TV / Android TV:** GameLingo-GoogleTV-v0.1.0-beta.1-TEST.apk – samostatná TV aplikace s párováním a podporou oranžového překladu.
          - **SHA256SUMS.txt** – kontrolní součty.

          ### Co je v této betě
          - Nová úvodní obrazovka iPhonu, modrobílé barvy a vlastní ikona GameLingo.
          - Funkční základ Xbox Remote Play, výběr více konzolí, rozpoznávání a překlad titulků.
          - Oddělené čtení herních dialogů a herních textů pomocí čtyř nastavitelných oblastí.
          - Google TV: šestímístné párování, překryv titulků a přesun oranžové oblasti.
          - Samostatné instalační ID; původní PlayCaption zůstává nainstalovaný nezávisle.

          ### Důležité před instalací
          - **iOS IPA není podepsaná** a je určena pro sideloading po vlastním podpisu.
          - Android APK jsou **testovací sestavení** podepsaná CI debug klíčem; aktualizace mohou vyžadovat přeinstalaci.
          - **PS5/PS4 v Android verzi** vychází z původní aplikace, ale v nově označeném GameLingo balíčku ještě nebyla otestována na skutečné konzoli.
          - **PS5 na iPhonu a PC nejsou podporovány.**
          - **Google TV a iPhone musí používat stejnou domácí síť.** Pokud je na TV spuštěný starý přijímač PlayCaption, nejprve jej zastav: oba používají port UDP 41989.
          - Překryv přes HDMI nemusí fungovat na každé značce TV nebo externím TV boxu.
          - Všechny funkce nově sestavených aplikací potřebují reálný test; jde o **pre-release**, nikoliv stabilní vydání.

          Zdrojové kódy a licence: [GameLingo](https://github.com/CaseyCZ/GameLingo), [původní PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app). Licence AGPL-3.0.
          EOF
          gh release create "$TAG" \
            release/GameLingo-iOS-v0.1.0-beta.1-unsigned.ipa \
            release/GameLingo-Android-v0.1.0-beta.1-TEST.apk \
            release/GameLingo-GoogleTV-v0.1.0-beta.1-TEST.apk \
            release/SHA256SUMS.txt \
            -R "$REPO" --target "$SOURCE" --title "GameLingo 0.1.0 Beta 1" \
            --prerelease --notes-file /tmp/gamelingo-release.md
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
