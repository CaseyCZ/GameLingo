name: GameLingo • quick regression checks

on:
  pull_request:
    branches: [Master]
    paths:
      - 'ios/**'
      - 'tools/**'
      - 'tests/**'
      - 'shared/**'
  workflow_dispatch:
  workflow_call:

# Native iOS/Android/Google TV packaging is deliberately separate.
# This inexpensive workflow checks changes without downloading and building Chiaki.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python integration contracts
        run: python3 -m unittest discover -s tests -p 'test_v05_integrations.py' -v
      - name: Python tooling syntax
        run: python3 -m compileall -q tools tests
      - name: Run latest-frame mailbox tests
        run: |
          swiftc ios/GameLingoIOS/App/LatestFrameMailbox.swift tests/LatestFrameMailboxTests.swift -o "$RUNNER_TEMP/latest-frame-tests"
          "$RUNNER_TEMP/latest-frame-tests"
      - name: Test explicit translation outcomes
        run: |
          swiftc ios/GameLingoIOS/App/TranslationOutcome.swift tests/TranslationOutcomeTests.swift -o "$RUNNER_TEMP/translation-outcome-tests"
          "$RUNNER_TEMP/translation-outcome-tests"
      - name: Test dialogue and game text stabilization
        run: |
          swiftc ios/GameLingoIOS/App/CaptionStability.swift tests/CaptionStabilityTests.swift -o "$RUNNER_TEMP/caption-stability-tests"
          "$RUNNER_TEMP/caption-stability-tests"
      - name: Test translation circuit breaker
        run: |
          swiftc ios/GameLingoIOS/App/TranslationOutcome.swift ios/GameLingoIOS/App/TranslationCircuitBreaker.swift tests/TranslationCircuitBreakerTests.swift -o "$RUNNER_TEMP/translation-breaker-tests"
          "$RUNNER_TEMP/translation-breaker-tests"
      - name: Test bounded diagnostic performance window
        run: |
          swiftc ios/GameLingoIOS/App/PerformanceWindow.swift tests/PerformanceWindowTests.swift -o "$RUNNER_TEMP/performance-window-tests"
          "$RUNNER_TEMP/performance-window-tests"
      - name: Test independent adaptive OCR cadence
        run: |
          swiftc ios/GameLingoIOS/App/OCRCadence.swift tests/OCRCadenceTests.swift -o "$RUNNER_TEMP/ocr-cadence-tests"
          "$RUNNER_TEMP/ocr-cadence-tests"
      - name: Test independent translation generations
        run: |
          swiftc ios/GameLingoIOS/App/TranslationRevision.swift tests/TranslationRevisionTests.swift -o "$RUNNER_TEMP/translation-revision-tests"
          "$RUNNER_TEMP/translation-revision-tests"
      - name: Test local pairing QR validation
        run: |
          swiftc ios/GameLingoIOS/App/PairingQRCode.swift tests/PairingQRCodeTests.swift -o "$RUNNER_TEMP/pairing-qr-tests"
          "$RUNNER_TEMP/pairing-qr-tests"
      - name: Test bounded opt-in translation history
        run: |
          swiftc ios/GameLingoIOS/App/TranslationHistory.swift tests/TranslationHistoryTests.swift -o "$RUNNER_TEMP/translation-history-tests"
          "$RUNNER_TEMP/translation-history-tests"
      - name: Test profile-local glossary rules
        run: |
          swiftc ios/GameLingoIOS/App/GameGlossary.swift tests/GameGlossaryTests.swift -o "$RUNNER_TEMP/game-glossary-tests"
          "$RUNNER_TEMP/game-glossary-tests"
      - name: Parse every iOS Swift source
        shell: bash
        run: |
          set -euo pipefail
          command -v swiftc
          while IFS= read -r -d '' file; do
            swiftc -frontend -parse "$file"
          done < <(find ios/GameLingoIOS/App -type f -name '*.swift' -print0)
