name: Publish GameLingo 0.2.0 Beta 1

on:
  push:
    branches:
      - feature/gamelingo-v02-unified-ui
    paths:
      - ".github/workflows/publish-gamelingo-v02.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish verified iOS, Android and Google TV installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-beta.1"
          SOURCE="e47ee35a790edc49e3b5022387873550fa96f0ef"
          BUILD_RUN="45167705462"
          REPO="$GITHUB_REPOSITORY"
          RESULT=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')
          ACTUAL_SHA=$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')
          test "$RESULT" = "success"
          test "$SOURCE" = "$ACTUAL_SHA"
          mkdir -p release
          gh run download "$BUILD_RUN" -R "$REPO" -n "GameLingo-v0.2.0-beta.1-all-installers" -D release
          test -s release/GameLingo-iOS-v0.2.0-beta.1-unsigned.ipa
          test -s release/GameLingo-Android-v0.2.0-beta.1-TEST.apk
          test -s release/GameLingo-GoogleTV-v0.2.0-beta.1-TEST.apk
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release exists; not overwriting."
            exit 0
          fi
          cat > /tmp/gamelingo-v02.md <<'EOF'
          ## 🎮 GameLingo 0.2.0 Beta 1 – vlastní jednotné rozhraní

          Přepracované GameLingo ve společném **tmavě modrém a bílém stylu CaseyCZ**. Jedná se o testovací vydání.

          ### Co je nové
          - **iPhone:** vlastní GameLingoIOS název, bundle ID a modrobílé rozhraní Xboxu, TV, nastavení, profilů, diagnostiky a čtyř oblastí.
          - **Android telefon:** nové UI, zachováno **PS5/PS4 a Xbox Remote Play** z open-source Android základu PlayCaption.
          - **Google TV / Android TV:** modrobílé menu, vlastní ikona/banner, PIN párování a známý přijímač **Orange V5**.
          - Samostatná instalace GameLingo neodstraňuje původní PlayCaption.

          ### Instalační soubory
          - GameLingo-iOS-v0.2.0-beta.1-unsigned.ipa – iPhone, nutný vlastní podpis.
          - GameLingo-Android-v0.2.0-beta.1-TEST.apk – Android telefon, PS5/PS4 a Xbox.
          - GameLingo-GoogleTV-v0.2.0-beta.1-TEST.apk – Google TV a Android TV.
          - SHA256SUMS.txt – kontrolní součty.

          ### ⚠️ Důležité před testem
          - **PS5 na iOS ještě není implementovaná**. Android kód nelze přímo spustit ve Swiftu.
          - **PC** zatím není podporováno.
          - PS5/Xbox režimy v nové Android APK se úspěšně sestavily, ale na skutečných konzolích ještě nebyly znovu ověřené.
          - Android APK jsou podepsané **testovacím podpisem**. Pro aktualizaci může být nutné odinstalovat předchozí testovací GameLingo Android/TV.
          - Starý PlayCaption může zůstat nainstalovaný, ale oba TV přijímače nesmí současně využívat **UDP 41989**.
          - Po instalaci nové Google TV aplikace znovu spáruj iPhone pomocí šestimístného kódu.
          - Překryv nad HDMI podporují jen vhodné televizory a jejich firmware.
          - Jde o **pre-release** bez potvrzení všech kombinací v reálném hraní.

          Zdrojový kód a licence: [GameLingo](https://github.com/CaseyCZ/GameLingo) · [PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app) · AGPL-3.0.
          EOF
          gh release create "$TAG" \
            release/GameLingo-iOS-v0.2.0-beta.1-unsigned.ipa \
            release/GameLingo-Android-v0.2.0-beta.1-TEST.apk \
            release/GameLingo-GoogleTV-v0.2.0-beta.1-TEST.apk \
            release/SHA256SUMS.txt \
            -R "$REPO" --target "$SOURCE" --title "GameLingo 0.2.0 Beta 1 – jednotné UI" \
            --prerelease --notes-file /tmp/gamelingo-v02.md
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '{url:.url, assets:[.assets[].name]}'
