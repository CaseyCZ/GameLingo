name: GameLingo • publish current test release
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/publish-current-test.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Master build run ID (empty = latest successful build)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: gamelingo-single-test-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'CaseyCZ/GameLingo' && github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_RUN: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record publication link
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=gamelingo/current-test-release -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Verify newest successful Master build and all installers
        shell: bash
        run: |
          set -euo pipefail
          # The full Master audit workflow is the only accepted source of installers.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/audit-0.5-ci.yml/runs?branch=Master&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          test -n "$latest"
          RUN="${REQUESTED_RUN:-$latest}"
          [[ "$RUN" =~ ^[0-9]+$ ]]
          test "$RUN" = "$latest"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > run.json
          jq -e '.head_branch == "Master" and .conclusion == "success" and .head_repository.full_name == "CaseyCZ/GameLingo" and (.path | startswith(".github/workflows/audit-0.5-ci.yml"))' run.json
          SHA="$(jq -r .head_sha run.json)"
          git fetch --no-tags origin Master
          git merge-base --is-ancestor "$SHA" origin/Master
          # Documentation/maintenance commits are allowed, but never publish older app source.
          git diff --exit-code "$SHA" origin/Master -- ios tools shared tests
          gh run download "$RUN" --name GameLingo-v0.5.0-dev-all-installers --dir installers
          cd installers
          test -s GameLingo-iOS-v0.5.0-dev-unsigned.ipa
          test -s GameLingo-Android-v0.5.0-dev-TEST.apk
          test -s GameLingo-GoogleTV-v0.5.0-dev-TEST.apk
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          sha256sum --strict -c SHA256SUMS.txt
          for file in GameLingo-iOS-v0.5.0-dev-unsigned.ipa GameLingo-Android-v0.5.0-dev-TEST.apk GameLingo-GoogleTV-v0.5.0-dev-TEST.apk; do
            grep -Fx "$(sha256sum "$file")" SHA256SUMS.txt
          done
          echo "BUILD_RUN=$RUN" >> "$GITHUB_ENV"
          echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v0.5.0-test-${SHA:0:8}-r$RUN" >> "$GITHUB_ENV"
      - name: Publish new release and verify downloaded assets before removing old releases
        shell: bash
        run: |
          set -euo pipefail
          # Keep existing tags and releases intact until the replacement is verified.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > old-releases.txt
          cat > notes.md <<EOF
          ## GameLingo – aktuální testovací verze

          Jediné aktuální testovací vydání pro iPhone, Android a Google TV.

          - iOS IPA je nepodepsaná, Android a TV APK jsou testovací.
          - Google TV: kompaktní párování, QR, mřížka nastavení, profily a výběr konzole.
          - Samostatná TV: hybridní text + OCR, pouze text nebo pouze OCR; bez mikrofonu a bez zvuku.
          - Pouze online překlad a lokální paměť. Kompatibilita chráněného obsahu není potvrzena.
          - Automatické sestavení a kontrolní součty prošly. Fyzické testy a úplné licenční ověření zůstávají otevřené.

          Zdroj: https://github.com/$GITHUB_REPOSITORY/tree/$BUILD_SHA
          Sestavení: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN
          Upstream Android: https://github.com/AdamRuzick4/PlayCaption-app/tree/633a847400b6c4bac1e7f034463e7847a53a9590
          Upstream iOS PS core: https://github.com/mB14ck22/tp-play/tree/482611539977496cad047560c9bc1ebc5809a566
          EOF
          files=(GameLingo-iOS-v0.5.0-dev-unsigned.ipa GameLingo-Android-v0.5.0-dev-TEST.apk GameLingo-GoogleTV-v0.5.0-dev-TEST.apk SHA256SUMS.txt)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --draft --prerelease --title "GameLingo 0.5.0 TEST · ${BUILD_SHA:0:8}" --notes-file notes.md
          fi
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" == true ]]; then
            for file in "${files[@]}"; do gh release upload "$RELEASE_TAG" "installers/$file" --clobber; done
          fi
          mkdir verified
          gh release download "$RELEASE_TAG" --dir verified
          for file in "${files[@]}"; do cmp "installers/$file" "verified/$file"; done
          (cd verified && sha256sum --strict -c SHA256SUMS.txt)
          if [[ "$draft" == true ]]; then gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false; fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets,url --jq 'if .isDraft or (.assets | length != 4) then error("Release validation failed") else . end'
          # Remove release objects only; preserve every Git tag and all source history.
          while IFS= read -r tag; do
            [[ -n "$tag" && "$tag" != "$RELEASE_TAG" ]] || continue
            gh release delete "$tag" --yes
          done < old-releases.txt
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > remaining.txt
          test "$(cat remaining.txt)" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json url,assets,isPrerelease
      - name: Report publication result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=gamelingo/current-test-release -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
