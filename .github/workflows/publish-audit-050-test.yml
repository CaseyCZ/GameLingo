name: GameLingo • publish 0.5.0 test pre-release

on:
  push:
    branches: [feature/audit-0.5]
    paths: [.github/workflows/publish-audit-050-test.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write

concurrency:
  group: gamelingo-050-test-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/feature/audit-0.5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '45436666976'
      BUILD_SHA: '81905d969196cc2b862d14f1cbd3a2dbe7b7ff80'
      RELEASE_TAG: 'v0.5.0-test-81905d9'
    steps:
      - name: Record publishing run
        run: |
          gh api --method POST "repos/$GH_REPO/statuses/$GITHUB_SHA" -f state=pending -f context=gamelingo/test-release -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" -f description="Publishing verified test installers"
      - name: Download only the validated candidate
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.head_sha == $sha and .conclusion == "success"' run.json
          gh run download "$BUILD_RUN" --name GameLingo-v0.5.0-dev-all-installers --dir installers
          cd installers
          test -s GameLingo-iOS-v0.5.0-dev-unsigned.ipa
          test -s GameLingo-Android-v0.5.0-dev-TEST.apk
          test -s GameLingo-GoogleTV-v0.5.0-dev-TEST.apk
          sha256sum --strict -c SHA256SUMS.txt
      - name: Publish test pre-release
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## GameLingo 0.5.0 – testovací sestavení

          Testovací balíčky pro iOS, Android a Google TV ze stejné revize.
          Automatické sestavení a kontroly balíčků prošly. Praktické testování na zařízení a úplné licenční ověření dosud neproběhlo.

          - Online překlad: Google, Microsoft, MyMemory jako poslední záloha.
          - Offline překladový model odstraněn; OCR a lokální paměť překladů zůstávají.
          - iOS IPA je nepodepsaná a vyžaduje vlastní podpis.
          - Android a Google TV jsou testovací APK.

          Build: https://github.com/CaseyCZ/GameLingo/actions/runs/45436666976
          Source: https://github.com/CaseyCZ/GameLingo/tree/81905d969196cc2b862d14f1cbd3a2dbe7b7ff80
          Upstream Android: https://github.com/AdamRuzick4/PlayCaption-app/tree/633a847400b6c4bac1e7f034463e7847a53a9590
          Upstream iOS PS core: https://github.com/mB14ck22/tp-play/tree/482611539977496cad047560c9bc1ebc5809a566
          Build scripts and dependency pins are in the source revision. License notices are included in the installers. SHA256SUMS.txt contains the candidate checksums.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite existing files."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --prerelease --title "GameLingo 0.5.0 TEST" --notes-file notes.md installers/GameLingo-iOS-v0.5.0-dev-unsigned.ipa installers/GameLingo-Android-v0.5.0-dev-TEST.apk installers/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk installers/SHA256SUMS.txt
          gh release view "$RELEASE_TAG" --json url,isPrerelease,assets
      - name: Report publication result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$GITHUB_SHA" -f state="$state" -f context=gamelingo/test-release -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" -f description="Test pre-release: $RESULT"
