name: Publish only newest GameLingo Beta (iOS, Android and Google TV)

on:
  # The default GITHUB_TOKEN can build but is denied Git tags and Releases
  # (HTTP 403). Manually dispatch only after adding the dedicated repository
  # secret GAMELINGO_RELEASE_TOKEN with Contents:write and Actions:read.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gamelingo-current-release
  cancel-in-progress: true

jobs:
  release:
    name: Publish three verified installers; remove old Releases after confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate all installers and create new beta
        env:
          GH_TOKEN: ${{ secrets.GAMELINGO_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing GAMELINGO_RELEASE_TOKEN. Set repository Actions secret with Contents:write + Actions:read, then rerun."
            exit 1
          fi
          REPO="$GITHUB_REPOSITORY"
          TAG="v0.5.0-beta.2"
          BUILD_SOURCE="89c78ef8f1d339d1b29c28d3f1406422dd313418"
          SOURCE="$GITHUB_SHA"
          IOS_SOURCE="0d14217afa19c90a7db551eec6d8e711eaad6d7b"
          IOS_RUN="45250577982"
          MATRIX_RUN="45261196428"

          # iOS is the latest successful unsigned IPA. Its source, asset
          # generator, build workflow and shared UI specification did not
          # change between IOS_SOURCE and SOURCE.
          test "$(gh api "repos/$REPO/actions/runs/$IOS_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$REPO/actions/runs/$IOS_RUN" --jq '.head_sha')" = "$IOS_SOURCE"
          test "$(gh api "repos/$REPO/actions/runs/$MATRIX_RUN" --jq '.head_sha')" = "$BUILD_SOURCE"

          changed="$(gh api "repos/$REPO/compare/$IOS_SOURCE...$BUILD_SOURCE" --jq '.files[].filename')"
          if grep -Eq '^(ios/|shared/mobile-ui\\.json$|tools/create_brand_assets\\.py$|\\.github/workflows/build-ios-gamelingo\\.yml$)' <<< "$changed"; then
            echo "::error::iOS source/build recipe changed since the last successful IPA. Do not publish mixed sources."
            exit 1
          fi

          # The GITHUB_TOKEN can be denied when tagging an older commit
          # containing GitHub Actions changes. The release tag instead
          # points to this workflow's HEAD, whose app source is identical
          # to the validated installer-source commit.
          since_build="$(gh api "repos/$REPO/compare/$BUILD_SOURCE...$SOURCE" --jq '.files[].filename')"
          if grep -Ev '^\.github/workflows/' <<< "$since_build" | grep -q .; then
            echo "::error::Non-workflow source changed since validated installer build."
            exit 1
          fi

          job_report="$(gh api "repos/$REPO/actions/runs/$MATRIX_RUN/jobs?per_page=100")"
          for job in "Android phone · PS5 / PS4 foundation" "Google TV · Orange V5 receiver"; do
            result="$(jq -r --arg job "$job" '.jobs[] | select(.name == $job) | .conclusion' <<< "$job_report")"
            test "$result" = "success" || {
              echo "::error::Installer job $job is not successfully complete: $result"
              exit 1
            }
          done

          mkdir -p release
          gh run download "$IOS_RUN" -R "$REPO" -n "GameLingo-iOS-v05-dev" -D release
          gh run download "$MATRIX_RUN" -R "$REPO" -n "GameLingo-Android-v05-dev" -D release
          gh run download "$MATRIX_RUN" -R "$REPO" -n "GameLingo-GoogleTV-v05-dev" -D release

          for file in \
            GameLingo-iOS-v0.5.0-dev-unsigned.ipa \
            GameLingo-Android-v0.5.0-dev-TEST.apk \
            GameLingo-GoogleTV-v0.5.0-dev-TEST.apk; do
            test -s "release/$file" || {
              echo "::error::Missing installer $file"
              exit 1
            }
            unzip -t "release/$file" >/dev/null
          done
          (cd release && sha256sum *.ipa *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

          cat > release-notes.md <<'EOF'
          # GameLingo 0.5.0 Beta 2

          **Nejnovější testovací verze** pro iPhone, Android mobil a Google TV.

          ### Co je nové
          - Sjednocené rozhraní iOS a Androidu: Domů, Obrazovka, Konzole, Nastavení, O aplikaci.
          - Pětikrokové úvodní nastavení a společná barevná paleta.
          - Android: skutečné přepínání stránek, výběr více konzolí, nové OCR nastavení a rozpoznávání herních textů.
          - Android: velikost, barva a pozadí titulků na telefonu; oddělené ovládání titulků pro TV.
          - Android: šestímístné PIN párování Google TV, chráněný uložený klíč a kontrola odpovědi TV.
          - Samostatný Google TV přijímač s překryvem titulků a ovládáním ovladačem.
          - Opravy indikace připravenosti a dokončování průvodce.

          ### Instalační soubory
          - **iOS:** `GameLingo-iOS-v0.5.0-dev-unsigned.ipa` — nepodepsaná IPA; před instalací je nutný podpis.
          - **Android mobil:** `GameLingo-Android-v0.5.0-dev-TEST.apk` — testovací APK.
          - **Google TV:** `GameLingo-GoogleTV-v0.5.0-dev-TEST.apk` — testovací APK.
          - **SHA256SUMS.txt** — kontrolní součty.

          **Původ sestavení:** Android a TV jsou ze společné revize `89c78ef`. iOS IPA pochází z úspěšného sestavení `0d14217`; porovnáním repozitáře bylo ověřeno, že se od té doby nezměnily žádné zdroje iOS, sdílená UI specifikace ani iOS sestavovací postup.

          **Upozornění:** jde o beta verzi. Připojení konzolí a skutečný překryv titulků musí být ověřeny na zařízeních. iOS a Android nemají dosud totožnou nabídku jazyků rozhraní a používají odlišný transport titulků do TV. Google TV přijímač umožňuje jen jeden aktivní spárovaný telefon; při střídání Androidu a iPhonu může být nutné párování opakovat.

          Licence AGPL-3.0 a původní projekt: [GameLingo](https://github.com/CaseyCZ/GameLingo), [PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app).
          EOF

          # Separate tag creation from Release creation. This also makes
          # repository/tag permission problems visible independently.
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # Try authenticated Git transport. The GitHub REST ref-create
            # endpoint returned integration 403 despite contents:write.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$SOURCE"
            git push origin "refs/tags/$TAG"
          fi
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE"

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE" || {
              echo "::error::Existing beta.2 tag points to wrong revision. Refusing overwrite."
              exit 1
            }
            gh release edit "$TAG" -R "$REPO" \
              --title "GameLingo 0.5.0 Beta 2" \
              --notes-file release-notes.md --prerelease
            gh release upload "$TAG" -R "$REPO" \
              release/GameLingo-iOS-v0.5.0-dev-unsigned.ipa \
              release/GameLingo-Android-v0.5.0-dev-TEST.apk \
              release/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk \
              release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              release/GameLingo-iOS-v0.5.0-dev-unsigned.ipa \
              release/GameLingo-Android-v0.5.0-dev-TEST.apk \
              release/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk \
              release/SHA256SUMS.txt \
              -R "$REPO" --target "$SOURCE" \
              --title "GameLingo 0.5.0 Beta 2" \
              --prerelease --notes-file release-notes.md
          fi

          # Verify each uploaded asset exists AND has the expected exact
          # byte size, before deleting even one older release listing.
          gh release view "$TAG" -R "$REPO" --json assets > published-assets.json
          for filename in \
            GameLingo-iOS-v0.5.0-dev-unsigned.ipa \
            GameLingo-Android-v0.5.0-dev-TEST.apk \
            GameLingo-GoogleTV-v0.5.0-dev-TEST.apk \
            SHA256SUMS.txt; do
            actual="$(jq -r --arg name "$filename" '.assets[] | select(.name == $name) | .size' published-assets.json)"
            expected="$(stat -c%s "release/$filename")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Release asset $filename has size $actual instead of $expected. Old releases preserved."
              exit 1
            fi
          done

          # User wants ONLY the newest GitHub Release. Do not delete git
          # tags or commits; those are project history, not release listings.
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            [ "$old" != "$TAG" ] || continue
            gh release delete "$old" -R "$REPO" --yes
          done < <(gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName')

          test "$(gh release list -R "$REPO" --limit 100 --json tagName --jq 'length')" = "1"
          gh release view "$TAG" -R "$REPO" \
            --json url,tagName,name,isPrerelease,assets \
            --jq '{url:.url,tag:.tagName,name:.name,beta:.isPrerelease,files:[.assets[].name]}'
