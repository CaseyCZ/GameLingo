name: Publish GameLingo 0.5 Beta 2 (verified installers)

on:
  push:
    branches:
      - feature/gamelingo-v05-platform-rebuild
    paths:
      - ".github/workflows/publish-gamelingo-current.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gamelingo-current-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify new builds and publish GameLingo Beta 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="v0.5.0-beta.2"
          SOURCE="$GITHUB_SHA"
          BUILD_SOURCE="89c78ef8f1d339d1b29c28d3f1406422dd313418"
          IOS_SHA="0d14217afa19c90a7db551eec6d8e711eaad6d7b"
          IOS_RUN="45250577982"
          MOBILE_TV_RUN="45261196428"

          # Match the proven Beta 1 publication workflow: native
          # GITHUB_TOKEN, gh release create --target, no manual git ref POST
          # and no external PAT/secret.
          test "$(gh api "repos/$REPO/actions/runs/$IOS_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$IOS_RUN" --jq '.head_sha')" = "$IOS_SHA"
          test "$(gh api "repos/$REPO/actions/runs/$MOBILE_TV_RUN" --jq '.head_sha')" = "$BUILD_SOURCE"

          source_changes="$(gh api "repos/$REPO/compare/$IOS_SHA...$BUILD_SOURCE" --jq '.files[].filename')"
          if grep -Eq '^(ios/|shared/mobile-ui\\.json$|tools/create_brand_assets\\.py$|\\.github/workflows/build-ios-gamelingo\\.yml$)' <<< "$source_changes"; then
            echo "::error::iOS sources changed after building the IPA."
            exit 1
          fi
          later_changes="$(gh api "repos/$REPO/compare/$BUILD_SOURCE...$SOURCE" --jq '.files[].filename')"
          if grep -Ev '^\\.github/workflows/' <<< "$later_changes" | grep -q .; then
            echo "::error::App sources changed since building Android and TV."
            exit 1
          fi
          for job in "Android phone · PS5 / PS4 foundation" "Google TV · Orange V5 receiver"; do
            state="$(gh api "repos/$REPO/actions/runs/$MOBILE_TV_RUN/jobs?per_page=100"               --jq '.jobs[] | select(.name == "'"$job"'") | .conclusion')"
            test "$state" = success
          done

          mkdir -p release
          gh run download "$IOS_RUN" -R "$REPO" -n "GameLingo-iOS-v05-dev" -D release
          gh run download "$MOBILE_TV_RUN" -R "$REPO" -n "GameLingo-Android-v05-dev" -D release
          gh run download "$MOBILE_TV_RUN" -R "$REPO" -n "GameLingo-GoogleTV-v05-dev" -D release

          for name in             GameLingo-iOS-v0.5.0-dev-unsigned.ipa             GameLingo-Android-v0.5.0-dev-TEST.apk             GameLingo-GoogleTV-v0.5.0-dev-TEST.apk; do
            test -s "release/$name"
            unzip -t "release/$name" >/dev/null
          done
          (cd release && sha256sum *.ipa *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          cat > release-notes.md <<'EOF'
          # GameLingo 0.5.0 Beta 2 — iPhone, Android, Google TV

          Nové testovací vydání se třemi instalačními soubory.

          - **iOS**: sjednocené rozhraní GameLingo, pět záložek, konzole Xbox/PlayStation, OCR a titulky.
          - **Android mobil**: pět skutečných záložek, nastavení OCR, velikost/barva/pozadí titulků, šestímístné párování Google TV.
          - **Google TV**: samostatná APK přijímače, překryv titulků a ovládání televizním ovladačem.
          - **SHA256SUMS.txt**: kontrolní součty všech tří instalátorů.

          iOS IPA je **nepodepsaná** a vyžaduje podpis před instalací. APK jsou testovací.
          iOS IPA pochází z úspěšného sestavení `0d14217` (následně nebyly změněny zdroje iOS).
          Android a TV byly sestaveny z `89c78ef`. V obou případech ověřena integrita.

          **Beta, nikoliv potvrzeně stabilní verze:** Xbox/PlayStation, OCR i příjem titulků vyžadují skutečné testy. Android a iOS zatím nemají úplně identický transport titulků do TV, ani všechny jazyky rozhraní. TV přijímač uchovává jedno aktivní párování telefonu.

          Licence AGPL-3.0. Zdroj: [GameLingo](https://github.com/CaseyCZ/GameLingo) a [PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app).
          EOF

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$tag_sha" = "$SOURCE" || { echo "::error::Tag already exists at a different revision"; exit 1; }
            gh release edit "$TAG" -R "$REPO"               --title "GameLingo 0.5.0 Beta 2" --notes-file release-notes.md --prerelease
            gh release upload "$TAG" -R "$REPO"               release/GameLingo-iOS-v0.5.0-dev-unsigned.ipa               release/GameLingo-Android-v0.5.0-dev-TEST.apk               release/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk               release/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG"               release/GameLingo-iOS-v0.5.0-dev-unsigned.ipa               release/GameLingo-Android-v0.5.0-dev-TEST.apk               release/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk               release/SHA256SUMS.txt               -R "$REPO" --target "$SOURCE"               --title "GameLingo 0.5.0 Beta 2"               --prerelease --notes-file release-notes.md
          fi

          # Preserve old releases if the new upload is partial. Delete old
          # listings only after all three installers and SHA256SUMS exist.
          gh release view "$TAG" -R "$REPO" --json assets --jq '.assets[].name' > uploaded.txt
          for name in             GameLingo-iOS-v0.5.0-dev-unsigned.ipa             GameLingo-Android-v0.5.0-dev-TEST.apk             GameLingo-GoogleTV-v0.5.0-dev-TEST.apk             SHA256SUMS.txt; do
            grep -Fxq "$name" uploaded.txt
          done
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' |
            while IFS= read -r old; do
              [ "$old" = "$TAG" ] && continue
              gh release delete "$old" -R "$REPO" --yes
            done
          gh release view "$TAG" -R "$REPO" --json url,tagName,assets             --jq '{url:.url,tag:.tagName,assets:[.assets[].name]}'
