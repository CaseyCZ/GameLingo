name: Publish latest GameLingo Beta 3 after verified iOS and TV pairing fixes

on:
  push:
    branches:
      - feature/gamelingo-v05-platform-rebuild
    paths:
      - ".github/workflows/publish-gamelingo-current.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gamelingo-current-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify new installers; publish Beta 3; then remove older releases
    runs-on: ubuntu-latest
    timeout-minutes: 155
    steps:
      - name: Wait for same-revision iPhone, Android and TV builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BUILD_RUN="45270380836"
          BUILD_SHA="40f1418fc9e5fac7495fa1df2c4ca58602b76e20"
          ACTUAL_SHA="$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq .head_sha)"
          test "$ACTUAL_SHA" = "$BUILD_SHA" || {
            echo "::error::Unexpected build revision: $ACTUAL_SHA"
            exit 1
          }
          # Only this release workflow is allowed to differ from the
          # fully validated app sources.
          CHANGED="$(gh api "repos/$REPO/compare/$BUILD_SHA...$GITHUB_SHA" --jq '.files[].filename')"
          if grep -Ev '^[.]github/workflows/' <<< "$CHANGED" | grep -q .; then
            echo "::error::App sources changed since the candidate compilation."
            exit 1
          fi
          for attempt in $(seq 1 300); do
            STATUS="$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.status + ":" + (.conclusion // "pending")')"
            if [ "$STATUS" = "completed:success" ]; then
              echo "Verified three-platform build $BUILD_RUN: $BUILD_SHA"
              break
            fi
            if [[ "$STATUS" == completed:* ]]; then
              echo "::error::Build $BUILD_RUN ended with $STATUS. Existing release is preserved."
              exit 1
            fi
            if [ "$attempt" -eq 300 ]; then
              echo "::error::Build $BUILD_RUN was not finished within the gate. Existing release is preserved."
              exit 1
            fi
            echo "Build $BUILD_RUN still $STATUS ($attempt/300)"
            sleep 30
          done
          for NAME in "iPhone · unsigned IPA" "Android phone · PS5 / PS4 foundation" "Google TV · Orange V5 receiver"; do
            RESULT="$(gh api "repos/$REPO/actions/runs/$BUILD_RUN/jobs?per_page=100" --jq ".jobs[] | select(.name == \"$NAME\") | .conclusion")"
            test "$RESULT" = "success" || {
              echo "::error::Job $NAME: $RESULT"
              exit 1
            }
          done

      - name: Publish only fully verified Beta 3 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="v0.5.0-beta.3"
          RUN_ID="45270380836"
          mkdir -p installers
          gh run download "$RUN_ID" -R "$REPO" -n "GameLingo-iOS-v05-dev" -D installers
          gh run download "$RUN_ID" -R "$REPO" -n "GameLingo-Android-v05-dev" -D installers
          gh run download "$RUN_ID" -R "$REPO" -n "GameLingo-GoogleTV-v05-dev" -D installers

          mv installers/GameLingo-iOS-v0.5.0-dev-unsigned.ipa \
             installers/GameLingo-iOS-v0.5.0-beta.3-unsigned.ipa
          mv installers/GameLingo-Android-v0.5.0-dev-TEST.apk \
             installers/GameLingo-Android-v0.5.0-beta.3-TEST.apk
          mv installers/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk \
             installers/GameLingo-GoogleTV-v0.5.0-beta.3-TEST.apk
          for FILE in \
            GameLingo-iOS-v0.5.0-beta.3-unsigned.ipa \
            GameLingo-Android-v0.5.0-beta.3-TEST.apk \
            GameLingo-GoogleTV-v0.5.0-beta.3-TEST.apk; do
            test -s "installers/$FILE"
            unzip -t "installers/$FILE" >/dev/null
          done
          (cd installers && sha256sum *.ipa *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

          cat > release-notes.md <<'EOF'
          # GameLingo 0.5.0 Beta 3

          Opravy pro **TCL/Google TV a iPhone**, včetně posledního sjednoceného Android mobilu.

          ### Opraveno
          - **Párování iPhone ↔ TV:** opakování ztracené UDP žádosti o šestimístný PIN na stejném spojení; TV krátce vrací stejnou bezpečnou odpověď při opakování správného PINu.
          - **Google TV:** správné rozlišení uloženého spárování a skutečně ověřeného spojení přes PING/PONG; přímá diagnostika příjmu.
          - **TCL C835:** kompaktnější domovská obrazovka, nabídka, nastavení a navigace ovladačem.
          - **iPhone:** menší karty, nadpisy a mezery při zachování ovladatelných dotykových ploch.
          - **Nápověda TV:** odstraněny zastaralé pokyny pro PlayCaption a chybné ID aplikace; aktuální postup GameLingo.
          - **Android mobil:** současná sjednocená aplikace a nové párování televize.

          ### Instalační soubory
          - `GameLingo-iOS-v0.5.0-beta.3-unsigned.ipa` — nepodepsaná iPhone aplikace; před instalací potřebuje podpis.
          - `GameLingo-Android-v0.5.0-beta.3-TEST.apk` — testovací Android mobil.
          - `GameLingo-GoogleTV-v0.5.0-beta.3-TEST.apk` — testovací Google TV / Android TV.
          - `SHA256SUMS.txt` — kontrolní součty souborů.

          **Upozornění:** úspěšná kompilace a ověření integrity nenahrazují skutečný test párování na konkrétní TV. Nové sestavení používá podpisové testovací APK; předchozí instalace může vyžadovat přeinstalování. iOS je nepodepsaná IPA.

          Licence AGPL-3.0. Zdroj: [GameLingo](https://github.com/CaseyCZ/GameLingo), založeno na [PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app).
          EOF

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            EXISTING_SHA="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            test "$EXISTING_SHA" = "$GITHUB_SHA" || {
              echo "::error::Beta 3 already exists at unexpected SHA. Refusing destructive overwrite."
              exit 1
            }
            gh release edit "$TAG" -R "$REPO" --title "GameLingo 0.5.0 Beta 3" --prerelease --notes-file release-notes.md
            gh release upload "$TAG" installers/*.ipa installers/*.apk installers/SHA256SUMS.txt -R "$REPO" --clobber
          else
            # Same GITHUB_TOKEN / gh release create approach that successfully
            # published Beta 2. No extra personal token or manual tag edits.
            gh release create "$TAG" \
              installers/*.ipa installers/*.apk installers/SHA256SUMS.txt \
              -R "$REPO" --target "$GITHUB_SHA" \
              --title "GameLingo 0.5.0 Beta 3" \
              --prerelease --notes-file release-notes.md
          fi

          gh release view "$TAG" -R "$REPO" --json assets > verified-assets.json
          for FILE in \
            GameLingo-iOS-v0.5.0-beta.3-unsigned.ipa \
            GameLingo-Android-v0.5.0-beta.3-TEST.apk \
            GameLingo-GoogleTV-v0.5.0-beta.3-TEST.apk \
            SHA256SUMS.txt; do
            EXPECTED="$(stat -c%s "installers/$FILE")"
            ACTUAL="$(jq -r --arg filename "$FILE" '.assets[] | select(.name == $filename) | .size' verified-assets.json)"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Release $FILE size mismatch (expected $EXPECTED, got $ACTUAL). Older release preserved."
              exit 1
            fi
          done

          # Older release listings disappear only after all new assets
          # have passed validation. Do not delete historic git tags/commits.
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' |
            while IFS= read -r PREVIOUS; do
              [ "$PREVIOUS" = "$TAG" ] && continue
              gh release delete "$PREVIOUS" -R "$REPO" --yes
            done

          test "$(gh release list -R "$REPO" --limit 100 --json tagName --jq 'length')" = 1
          gh release view "$TAG" -R "$REPO" --json url,tagName,assets \
            --jq '{url:.url,tag:.tagName,assets:[.assets[].name]}'
