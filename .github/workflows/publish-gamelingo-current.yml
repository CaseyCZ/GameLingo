name: GameLingo · Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: gamelingo-current-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'CaseyCZ/GameLingo' && github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare next release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/Master" --jq .commit.sha)" = "$GITHUB_SHA"
          gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' > published-tags.txt
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path("shared/version.json")
          data = json.loads(p.read_text())
          current = tuple(map(int, data["version"].split(".")))
          published = []
          for tag in Path("published-tags.txt").read_text().splitlines():
              m = re.match(r"^v(\d+)\.(\d+)\.(\d+)(?:-|$)", tag)
              if m:
                  published.append(tuple(map(int, m.groups())))
          if published and current <= max(published):
              major, minor, patch = max(published)
              data["version"] = f"{major}.{minor}.{patch + 1}"
              data["build"] += 1
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          SOURCE="$GITHUB_SHA"
          if ! git diff --quiet -- shared/version.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shared/version.json
            git commit -m "Prepare next GameLingo release"
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:Master
            SOURCE="$(git rev-parse HEAD)"
          fi
          # Workflow-only commits may not trigger the path-filtered native CI.
          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/audit-0.5-ci.yml/runs?branch=Master&head_sha=$SOURCE&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$RUN" ]; then
            gh workflow run audit-0.5-ci.yml --ref Master
          fi
          echo "RELEASE_SOURCE=$SOURCE" >> "$GITHUB_ENV"
      - name: Read shared version
        run: python3 tools/sync_version.py --github-env
      - name: Record publication link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SOURCE" -X POST -f state=pending -f context=gamelingo/current-test-release -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Verify new builds and publish GameLingo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAMELINGO_TV_KEYSTORE_B64: ${{ secrets.GAMELINGO_TV_KEYSTORE_B64 }}
          GAMELINGO_TV_KEYSTORE_PASSWORD: ${{ secrets.GAMELINGO_TV_KEYSTORE_PASSWORD }}
          GAMELINGO_MOBILE_KEYSTORE_B64: ${{ secrets.GAMELINGO_MOBILE_KEYSTORE_B64 }}
          GAMELINGO_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.GAMELINGO_MOBILE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          SOURCE="$RELEASE_SOURCE"
          RUN=""
          for attempt in $(seq 1 30); do
            RUN="$(gh api "repos/$REPO/actions/workflows/audit-0.5-ci.yml/runs?branch=Master&head_sha=$SOURCE&per_page=1" --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN" ]; then break; fi
            sleep 10
          done
          test -n "$RUN"
          BUILD_SOURCE="$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_sha')"
          # Never fall back to an earlier successful build while the new candidate is running.
          # Only the exact candidate can be published.
          for attempt in $(seq 1 70); do
            status="$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.status')"
            if [ "$status" = completed ]; then break; fi
            echo "Waiting for candidate build $RUN ($status)"
            sleep 30
          done
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq '.head_branch')" = Master
          TAG="v${GAMELINGO_VERSION}-test-${BUILD_SOURCE:0:8}-r$RUN"
          # Publish only the exact tested source revision, never an older candidate.
          test "$BUILD_SOURCE" = "$SOURCE"
          test "$(gh api "repos/$REPO/branches/Master" --jq .commit.sha)" = "$SOURCE"
          mkdir -p release
          gh run download "$RUN" -R "$REPO" -n "GameLingo-v${GAMELINGO_VERSION}-dev-all-installers" -D release
          files=(GameLingo-iOS-v${GAMELINGO_VERSION}-dev-unsigned.ipa GameLingo-Android-v${GAMELINGO_VERSION}-dev-TEST.apk GameLingo-GoogleTV-v${GAMELINGO_VERSION}-dev-TEST.apk SHA256SUMS.txt)
          for name in "${files[@]}"; do test -s "release/$name"; done
          (cd release && sha256sum --strict -c SHA256SUMS.txt)
          for name in "${files[@]:0:3}"; do
            unzip -t "release/$name" >/dev/null
            (cd release && grep -Fx "$(sha256sum "$name")" SHA256SUMS.txt)
          done
          python3 tools/create_tv_update_manifest.py "release/GameLingo-GoogleTV-v${GAMELINGO_VERSION}-dev-TEST.apk" "$TAG" "$GAMELINGO_VERSION" release/GameLingo-TV-update.json
          python3 tools/create_tv_update_manifest.py "release/GameLingo-Android-v${GAMELINGO_VERSION}-dev-TEST.apk" "$TAG" "$GAMELINGO_VERSION" release/GameLingo-Android-update.json --variant mobile
          python3 tools/create_ios_update_manifest.py "release/GameLingo-iOS-v${GAMELINGO_VERSION}-dev-unsigned.ipa" "$TAG" "$GAMELINGO_VERSION" "$GAMELINGO_BUILD" release/GameLingo-iOS-update.json
          files+=(GameLingo-TV-update.json GameLingo-Android-update.json GameLingo-iOS-update.json)
          cat > release-notes.md <<EOF
          # GameLingo ${GAMELINGO_VERSION} TEST
          Překlad herních titulků a textů v reálném čase.

          - iOS (IPA k vlastnímu podepsání), Android a Google TV (APK).
          - Aktualizace v aplikaci, nastavitelné OCR oblasti, profily a slovníky.
          - Testovací vydání; fyzické a licenční ověření není dokončeno. Párování jen v důvěryhodné domácí síti (nešifrovaný přenos).

          [Zdrojový kód](https://github.com/$REPO/tree/$BUILD_SOURCE) · [Licence a původ](https://github.com/$REPO/blob/$BUILD_SOURCE/ATTRIBUTION.md)
          EOF
          # A new public release must advance the semantic version. Retrying the same tag is safe.
          gh release list -R "$REPO" --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' > existing-versions.txt
          python3 - "$GAMELINGO_VERSION" "$TAG" <<'PY'
          import re, sys
          from pathlib import Path
          version, tag = sys.argv[1:]
          current = tuple(map(int, version.split(".")))
          for old in Path("existing-versions.txt").read_text().splitlines():
              if old == tag:
                  continue
              match = re.match(r"^v(\d+)\.(\d+)\.(\d+)(?:-|$)", old)
              if match and tuple(map(int, match.groups())) >= current:
                  raise SystemExit("Publication blocked: increase shared/version.json before building a new release.")
          PY
          # Resume a draft after a failed upload; never expose partial assets.
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --target "$SOURCE" --title "GameLingo ${GAMELINGO_VERSION} TEST · ${BUILD_SOURCE:0:8}" --draft --prerelease --notes-file release-notes.md
          fi
          if [ "$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft)" = true ]; then
            for name in "${files[@]}"; do
              actual="$(gh release view "$TAG" -R "$REPO" --json assets | jq -r --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .size')"
              if [ "$actual" != "$(stat -c%s "release/$name")" ]; then
                gh release upload "$TAG" "release/$name" -R "$REPO" --clobber || echo "::warning::Upload reported failure; checking stored asset."
                actual="$(gh release view "$TAG" -R "$REPO" --json assets | jq -r --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .size')"
                test "$actual" = "$(stat -c%s "release/$name")"
              fi
            done
          fi
          gh release view "$TAG" -R "$REPO" --json assets > published-assets.json
          test "$(jq '.assets | length' published-assets.json)" = 7
          for name in "${files[@]}"; do
            actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' published-assets.json)"
            test "$actual" = "$(stat -c%s "release/$name")"
          done
          mkdir -p published
          gh release download "$TAG" -R "$REPO" -D published
          for name in "${files[@]}"; do cmp "release/$name" "published/$name"; done
          test "$(gh api "repos/$REPO/branches/Master" --jq .commit.sha)" = "$SOURCE"
          if [ "$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease=true
          fi
          test "$(gh release view "$TAG" -R "$REPO" --json isDraft --jq .isDraft)" = false
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' > old-releases.txt
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$TAG" ] && continue
            gh release delete "$old" -R "$REPO" --yes
          done < old-releases.txt
          test "$(gh release list -R "$REPO" --limit 100 --json tagName --jq 'length')" = 1
          gh release view "$TAG" -R "$REPO" --json url,tagName,assets,isPrerelease
      - name: Report publication status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SOURCE" -X POST -f state="$state" -f context=gamelingo/current-test-release -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  cleanup_tags:
    name: Remove obsolete GameLingo test tags
    needs: release
    if: ${{ !cancelled() && github.repository == 'CaseyCZ/GameLingo' && github.ref == 'refs/heads/Master' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve current release and remove older unreferenced test tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > releases.json
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' > tags.txt
          python3 tools/cleanup_release_tags.py releases.json tags.txt > obsolete-tags.txt
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            # Fail closed if a release was created or changed during cleanup.
            gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > current-releases.json
            python3 tools/cleanup_release_tags.py current-releases.json tags.txt > current-obsolete.txt
            grep -Fxq -- "$old" current-obsolete.txt || { echo "::error::Release state changed; refusing to delete $old"; exit 1; }
            gh api --method DELETE "repos/$REPO/git/refs/tags/$old"
            echo "Removed obsolete tag: $old"
          done < obsolete-tags.txt
          gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > releases.json
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' > tags.txt
          python3 tools/cleanup_release_tags.py releases.json tags.txt > remaining-obsolete.txt
          test ! -s remaining-obsolete.txt
          echo "Current release and non-obsolete tags preserved."
