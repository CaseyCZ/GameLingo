name: OCR Lab automatic comparison
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'ocr-lab/**'
      - '.github/workflows/ocr-lab-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocr-lab-benchmark
  cancel-in-progress: true
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [tesseract, windows, rapid]
    defaults:
      run:
        working-directory: ocr-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - if: matrix.engine == 'tesseract'
        run: |
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path += ';C:\Program Files\Tesseract-OCR'
          tesseract --version
          tesseract --list-langs
      - if: matrix.engine == 'windows'
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from winrt.windows.media.ocr import OcrEngine; print('OCR languages:', [x.language_tag for x in OcrEngine.available_recognizer_languages])"
      - if: matrix.engine == 'rapid'
        run: python -m pip install -r requirements-rapid.txt
      - run: python auto_benchmark.py --engine ${{ matrix.engine }} --output benchmark-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.engine }}
          path: ocr-lab/benchmark-results/
          if-no-files-found: warn
          retention-days: 7
