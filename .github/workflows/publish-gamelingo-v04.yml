name: Publish GameLingo 0.4.0 Beta 1

on:
  push:
    branches:
      - feature/gamelingo-v04-all-screens
    paths:
      - ".github/workflows/publish-gamelingo-v04.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify packages and publish GameLingo Beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.4.0-beta.1"
          BUILD_RUN="45183559865"
          SOURCE="04864ce8ffa49a371a141d0595dea0b946482595"
          REPO="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$SOURCE"
          mkdir -p release
          gh run download "$BUILD_RUN" -R "$REPO" -n "GameLingo-v0.4.0-beta.1-all-installers" -D release
          test -s release/GameLingo-iOS-v0.4.0-beta.1-unsigned.ipa
          test -s release/GameLingo-Android-v0.4.0-beta.1-TEST.apk
          test -s release/GameLingo-GoogleTV-v0.4.0-beta.1-TEST.apk
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release exists; do not overwrite installers."
            exit 0
          fi
          cat > /tmp/gamelingo-v04.md <<'EOF'
          ## 🎮 GameLingo 0.4.0 Beta 1 – nové rozhraní všude

          **Všechny obrazovky v jednotném vzhledu GameLingo.** Krátké názvy, přehledné karty a vysvětlení až po otevření volitelné **(?) Nápovědy**.

          ### iPhone
          - Kompletně upravené stránky Xboxu, přihlášení Microsoftu, výběru více Xboxů, Google TV a párování.
          - Nový čistý editor čtyř oblastí: modrá, zelená, žlutá a oranžová.
          - Nové stránky OCR, překladu, titulků, profilů her a diagnostiky.
          - Přímé ovládání zůstává napojené na původní Xbox a Orange V5 funkce.

          ### Android telefon
          - Přestavěná hlavní obrazovka, nastavení překladu, profily a navigace.
          - Nové přehlednější kroky Xbox a PlayStation 5 / 4 připojení a párování.
          - Volitelná nápověda místo dlouhých popisů.
          - Zachována skutečná implementace Android Xbox / PS5 Remote Play z PlayCaptionu.

          ### Google TV / Android TV
          - Nová hlavní nabídka: **Překlad z telefonu** nebo **Přímo na TV**.
          - Nové záhlaví GameLingo na stránkách Xboxu a PlayStationu, volitelná nápověda.
          - Přijímač se šestimístným párovacím kódem a kontrolou spojení.
          - Zachován přenos běžných i oranžových herních titulků Orange V5.

          ### Instalační soubory
          - GameLingo-iOS-v0.4.0-beta.1-unsigned.ipa – iPhone, potřebuje vlastní podpis.
          - GameLingo-Android-v0.4.0-beta.1-TEST.apk – Android telefon, Xbox/PS5/PS4.
          - GameLingo-GoogleTV-v0.4.0-beta.1-TEST.apk – Google TV / Android TV.
          - SHA256SUMS.txt – součty SHA-256.

          ### ⚠️ Poznámky k testování
          - Jde o beta verzi: sestavení i součty jsou ověřené, ale nové obrazovky a spojení Xbox/PS5/TV ještě vyžadují test na skutečných zařízeních.
          - **PS5 na iPhonu není implementovaná**. Android varianta využívá původní PlayStation Remote Play.
          - Testovací Android APK používají dočasný vývojový podpis; předchozí GameLingo může být nutné odinstalovat.
          - Původní PlayCaption ponech jako zálohu. Dva současně spuštěné TV přijímače mohou kolidovat na UDP 41989.
          - Překryv titulků nad HDMI obrazem vyžaduje vhodný televizor.

          Otevřený zdrojový kód: [GameLingo](https://github.com/CaseyCZ/GameLingo) · původní [PlayCaption](https://github.com/AdamRuzick4/PlayCaption-app) · licence AGPL-3.0.
          EOF
          gh release create "$TAG" \
            release/GameLingo-iOS-v0.4.0-beta.1-unsigned.ipa \
            release/GameLingo-Android-v0.4.0-beta.1-TEST.apk \
            release/GameLingo-GoogleTV-v0.4.0-beta.1-TEST.apk \
            release/SHA256SUMS.txt \
            -R "$REPO" --target "$SOURCE" \
            --title "GameLingo 0.4.0 Beta 1 – všechny obrazovky" \
            --prerelease --notes-file /tmp/gamelingo-v04.md
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
