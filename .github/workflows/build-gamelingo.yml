name: GameLingo • iOS / Android / Google TV

on:
  push:
    branches:
      - feature/gamelingo-v05-platform-rebuild
    paths:
      - ".github/workflows/build-gamelingo.yml"
  workflow_dispatch:

# A single current candidate per branch: outdated queued native builds
# must not consume resources or be mistaken for the latest release candidate.
concurrency:
  group: gamelingo-v05-full-${{ github.ref }}
  cancel-in-progress: true

# UI-parity candidate: same welcome flow, settings, Xbox/PS/TV cards and translation languages on Android and iOS.
# Single compilation gate for the updated four-step Android wizard, neon device manager and native iPhone UI.
# Run full integration matrix only when this workflow is explicitly revised.
# This prevents expensive native Chiaki builds for every draft source change.
# QA v0.5.0: tests + PS4/PS5 core + iPhone + Android + Google TV.
# One-source full matrix checkpoint: native iPhone PS core + latest P0/P1 navigation and TV focus.
# Final source checkpoint includes session-revision OCR isolation and shared iOS theme.
# Candidate validation: unified TV setup, Xbox/PlayStation selection, safe OCR output, native dashboard.
# QA after P0/P1: native TV picker, Xbox removal, single PS PIN UI, old-overlay retransmission cancellation.
# Final reviewed UI checkpoint: saved Xbox, original settings, full-screen first run, acceptance plan.
# Run on workflow revision only; do not auto-build full native matrix for every change.
permissions:
  contents: read

jobs:
  contracts:
    name: GameLingo · integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify platforms and device selection are wired
        run: python3 -m unittest discover -s tests -p 'test_v05_integrations.py' -v

  ios:
    needs: contracts
    name: iPhone · unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mB14ck22/tp-play
          ref: 482611539977496cad047560c9bc1ebc5809a566
          path: ps-core
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check iOS platform routing, device manager and PS4/PS5 OCR source contracts
        run: python tools/verify_gamelingo.py
      - name: Generate original GameLingo icon
        run: |
          python -m pip install pillow
          python tools/create_brand_assets.py ios ios/GameLingoIOS/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          file ios/GameLingoIOS/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Build native PlayStation 4/5 Chiaki streaming core
        run: |
          set -euo pipefail
          brew install cmake ninja protobuf xcodegen
          export DEVELOPER_DIR="$(xcode-select -p)"
          # The pinned TP Play script pins Python protobuf 7.36.0, while
          # Homebrew protoc 36.2 generates code requiring 7.36.2. The core
          # fails before compilation unless generator/runtime versions match.
          PROTOC_VERSION="$(protoc --version | awk '{print $2}')"
          PROTOBUF_RUNTIME="7.$PROTOC_VERSION"
          echo "Matching protoc $PROTOC_VERSION to protobuf $PROTOBUF_RUNTIME"
          /usr/bin/sed -i '' "s/7\\.36\\.0/$PROTOBUF_RUNTIME/g" ps-core/ios/scripts/build-core.sh
          bash ps-core/ios/scripts/build-core.sh iphoneos
          test -s ps-core/ios/.build/iphoneos/libTPPlayCore.a
          file ps-core/ios/.build/iphoneos/libTPPlayCore.a
      - name: Prepare Xcode project
        run: |
          xcodebuild -version
          cd ios/GameLingoIOS
          xcodegen generate
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild -project ios/GameLingoIOS/GameLingoIOS.xcodeproj \
            -scheme GameLingoIOS -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$PWD/.build-ios.log"
      - name: Verify GameLingo identity and package IPA
        run: |
          set -euo pipefail
          APP="$PWD/.build/DerivedData/Build/Products/Release-iphoneos/GameLingoIOS.app"
          test -f "$APP/GameLingoIOS"
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          LABEL=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          test "$ID" = "cz.caseycz.gamelingo.ios"
          test "$LABEL" = "GameLingo"
          test "$VERSION" = "0.5.0"
          file "$APP/GameLingoIOS"
          mkdir -p "$PWD/.build/ipa/Payload"
          cp -R "$APP" "$PWD/.build/ipa/Payload/"
          (cd "$PWD/.build/ipa" && zip -qry "$GITHUB_WORKSPACE/GameLingo-iOS-v0.5.0-dev-unsigned.ipa" Payload)
          unzip -t GameLingo-iOS-v0.5.0-dev-unsigned.ipa >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-iOS-v05-dev
          path: GameLingo-iOS-v0.5.0-dev-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Xcode log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GameLingo-iOS-build-log
          path: .build-ios.log
          if-no-files-found: ignore

  android_mobile:
    needs: contracts
    name: Android phone · PS5 / PS4 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamRuzick4/PlayCaption-app
          ref: 633a847400b6c4bac1e7f034463e7847a53a9590
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Brand independent Android mobile app
        run: |
          python -m pip install pillow
          python -m py_compile kit/tools/polish_gamelingo.py kit/tools/redesign_gamelingo.py kit/tools/polish_all_screens.py kit/tools/android_multi_xbox.py kit/tools/wire_android_devices.py kit/tools/wire_gamelingo_languages.py
          python kit/tools/brand_android.py mobile upstream
          python kit/tools/create_brand_assets.py android upstream
          python kit/tools/polish_gamelingo.py upstream
          python kit/tools/redesign_gamelingo.py mobile upstream
          python kit/tools/polish_all_screens.py mobile upstream
          python kit/tools/android_multi_xbox.py upstream
          python kit/tools/wire_android_devices.py upstream
          python kit/tools/wire_gamelingo_languages.py upstream
          python kit/tools/verify_gamelingo.py --android-root upstream --mode mobile
          sed -i 's@gradle-9\.6\.0-bin\.zip@gradle-8.7-bin.zip@' upstream/gradle/wrapper/gradle-wrapper.properties
      - name: Build Android phone APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Android mobile identity
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='cz.caseycz.gamelingo.mobile'"
          cp "$APK" GameLingo-Android-v0.5.0-dev-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-Android-v05-dev
          path: GameLingo-Android-v0.5.0-dev-TEST.apk
          if-no-files-found: error
          retention-days: 30

  google_tv:
    needs: contracts
    name: Google TV · Orange V5 receiver
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamRuzick4/PlayCaption-app
          ref: 633a847400b6c4bac1e7f034463e7847a53a9590
          path: upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply tested receiver and GameLingo branding
        run: |
          python -m pip install pillow
          python -m py_compile kit/tools/patch_tv_iphone.py kit/tools/brand_android.py kit/tools/create_brand_assets.py
          python kit/tools/patch_tv_iphone.py upstream
          python kit/tools/brand_android.py tv upstream
          python kit/tools/create_brand_assets.py android upstream
          python kit/tools/polish_gamelingo.py upstream
          python kit/tools/redesign_gamelingo.py tv upstream
          python kit/tools/polish_all_screens.py tv upstream
          python kit/tools/android_multi_xbox.py upstream
          python kit/tools/wire_android_devices.py upstream
          python kit/tools/wire_gamelingo_languages.py upstream
          python kit/tools/verify_gamelingo.py --android-root upstream --mode tv
          grep -q "Připojte svůj telefon" upstream/app/src/main/java/cz/titulky/tv/MainActivity.kt
          grep -q "IPhoneTVPairing.verify" upstream/app/src/main/java/cz/titulky/tv/Propojeni.kt
          grep -q "EXTRA_VYSTUP_VOLEB" upstream/app/src/main/java/cz/titulky/tv/OverlayService.kt
          sed -i 's@gradle-9\.6\.0-bin\.zip@gradle-8.7-bin.zip@' upstream/gradle/wrapper/gradle-wrapper.properties
      - name: Build Google TV APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Google TV identity
        run: |
          set -euo pipefail
          APK=$(find upstream/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "package: name='cz.caseycz.gamelingo.tv'"
          cp "$APK" GameLingo-GoogleTV-v0.5.0-dev-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-GoogleTV-v05-dev
          path: GameLingo-GoogleTV-v0.5.0-dev-TEST.apk
          if-no-files-found: error
          retention-days: 30

  package:
    name: Validate all packages and checksums
    needs: [ios, android_mobile, google_tv]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GameLingo-*-v05-dev
          merge-multiple: true
          path: release
      - name: Verify all outputs and calculate SHA-256
        run: |
          set -euo pipefail
          test -s release/GameLingo-iOS-v0.5.0-dev-unsigned.ipa
          test -s release/GameLingo-Android-v0.5.0-dev-TEST.apk
          test -s release/GameLingo-GoogleTV-v0.5.0-dev-TEST.apk
          (cd release && sha256sum *.ipa *.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GameLingo-v0.5.0-dev-all-installers
          path: release/
          if-no-files-found: error
          retention-days: 30
