name: Native GameLingo candidate
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - '.github/workflows/ocr-lab-native-build.yml'
  workflow_dispatch:
# Explicit signed QA checkpoint: authenticated QR/manual pairing, permanent signatures and offline mobile fallback.
permissions:
  contents: read
jobs:
  quick:
    if: github.repository == 'CaseyCZ/GameLingo' && github.ref == 'refs/heads/feature/ocr-lab'
    uses: ./.github/workflows/fast-gamelingo-checks.yml
  native:
    needs: quick
    uses: ./.github/workflows/build-gamelingo.yml
    with:
      require_permanent_signing: true
    secrets:
      GAMELINGO_TV_KEYSTORE_B64: ${{ secrets.GAMELINGO_TV_KEYSTORE_B64 }}
      GAMELINGO_TV_KEYSTORE_PASSWORD: ${{ secrets.GAMELINGO_TV_KEYSTORE_PASSWORD }}
      GAMELINGO_MOBILE_KEYSTORE_B64: ${{ secrets.GAMELINGO_MOBILE_KEYSTORE_B64 }}
      GAMELINGO_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.GAMELINGO_MOBILE_KEYSTORE_PASSWORD }}
