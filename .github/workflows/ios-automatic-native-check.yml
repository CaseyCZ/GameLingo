name: iOS automatic dialogue native checks
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'ios/**'
      - 'tests/AutomaticDialogueLayoutTests.swift'
      - '.github/workflows/ios-automatic-native-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test native geometry
        run: |
          swiftc ios/GameLingoIOS/App/AutomaticDialogueLayout.swift tests/AutomaticDialogueLayoutTests.swift -o "$RUNNER_TEMP/automatic-dialogue-tests"
          "$RUNNER_TEMP/automatic-dialogue-tests"
      - name: Parse iOS app sources
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            swiftc -frontend -parse "$file"
          done < <(find ios/GameLingoIOS/App -name '*.swift' -print0)
