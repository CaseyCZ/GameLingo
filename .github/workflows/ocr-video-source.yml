name: OCR video source preparation
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'video-lab/**'
      - '.github/workflows/ocr-video-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned public gameplay demo for evaluation only
        run: |
          mkdir -p "$RUNNER_TEMP/video-lab/frames" video-lab/results
          curl --fail --location --retry 2 --max-time 60 --max-filesize 10000000 \
            'https://raw.githubusercontent.com/pigro141/livedub/5666537f002c75c1b4697634ad42e64ae58cb6f1/assets/vetrina/doppiaggio-gtav.mp4' \
            -o "$RUNNER_TEMP/video-lab/input.mp4"
          sha256sum "$RUNNER_TEMP/video-lab/input.mp4" | tee video-lab/results/source-sha256.txt
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,r_frame_rate -of json "$RUNNER_TEMP/video-lab/input.mp4" | tee video-lab/results/source.json
      - name: Extract sequential video frames for local evaluation
        run: |
          ffmpeg -hide_banner -loglevel error -i "$RUNNER_TEMP/video-lab/input.mp4" -t 15 -vf fps=4 -an "$RUNNER_TEMP/video-lab/frames/%04d.png"
          count=$(find "$RUNNER_TEMP/video-lab/frames" -name '*.png' | wc -l)
          test "$count" -gt 0
          echo "VIDEO_FRAMES=$count" | tee video-lab/results/frames.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-source-metadata
          path: video-lab/results/
          retention-days: 7
