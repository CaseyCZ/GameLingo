name: iOS OCR engine benchmark
on:
  push:
    branches: [feature/ocr-lab]
    paths:
      - 'ios-ocr-lab/**'
      - '.github/workflows/ios-ocr-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r ocr-lab/requirements.txt
      - run: python mlkit-lab/prepare_fixtures.py
      - run: brew install xcodegen
      - name: Generate standalone test project
        working-directory: ios-ocr-lab
        run: |
          xcodegen generate
          pod install
      - name: Select available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/ocr-sims.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          devices=json.load(open('/tmp/ocr-sims.json'))['devices']
          for runtime in sorted(devices, reverse=True):
              if '.iOS-' not in runtime:continue
              candidates=[d for d in devices[runtime] if d.get('isAvailable') and d['name'].startswith('iPhone')]
              if candidates:
                  print('OCR_SIM='+candidates[0]['udid'])
                  break
          else:raise SystemExit('No iOS simulator available')
          PY
      - name: Run real OCR on iOS simulator
        working-directory: ios-ocr-lab
        run: |
          mkdir -p results
          set -o pipefail
          xcodebuild test -workspace IOSOCRLab.xcworkspace -scheme IOSOCRLab \
            -destination "platform=iOS Simulator,id=$OCR_SIM" \
            -parallel-testing-enabled NO -resultBundlePath /tmp/ios-ocr.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=x86_64 | tee results/xcodebuild.log
      - name: Score results
        if: always()
        run: python ios-ocr-lab/summarize.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ocr-results
          path: ios-ocr-lab/results/
          if-no-files-found: warn
          retention-days: 7
