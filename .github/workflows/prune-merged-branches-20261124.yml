name: One-time cleanup of merged branches
on:
  push:
    branches: [Master]
    paths: ['.github/workflows/prune-merged-branches-20261124.yml']
permissions:
  contents: read
jobs:
  prune:
    if: github.repository == 'CaseyCZ/GameLingo' && github.ref == 'refs/heads/Master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record run link
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=gamelingo/branch-cleanup -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Remove only the seven verified merged branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin Master
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = Master
          test "$(gh pr list --state open --limit 100 --json number --jq length)" = 0
          leases=()
          deletions=()
          while read -r name expected; do
            ref="refs/heads/$name"
            actual="$(git ls-remote --heads origin "$ref" | cut -f1)"
            if [[ -z "$actual" ]]; then
              echo "Already absent: $name"
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Branch changed since audit: $name"
              exit 1
            fi
            git merge-base --is-ancestor "$expected" origin/Master
            leases+=("--force-with-lease=$ref:$expected")
            deletions+=(":$ref")
          done <<'BRANCHES'
          feature/audit-0.5 64cb0d904171822bb907f6f7659ef90c73669483
          feature/gameligo-v01-cross-platform 56c701f4e67e0a28c64d98f4162680369200e6b7
          feature/gamelingo-v01-apps ad904763ac87a244e47202125ab3dac566578b21
          feature/gamelingo-v02-unified-ui 86c40c134d0aa204738e241b799746c27052fa35
          feature/gamelingo-v03-reference-ui 6b10c3af4d103890ee97fb5e13d6a9ea2bd90be9
          feature/gamelingo-v04-all-screens 4c6f04b2562d173a6ca164e68a65a4ec803ebee5
          feature/gamelingo-v05-platform-rebuild e0e4c8b290961ffdad3f6902fca64a09346b9176
          BRANCHES
          if (( ${#deletions[@]} > 0 )); then
            git push --atomic "${leases[@]}" origin "${deletions[@]}"
          fi
          git ls-remote --heads origin
          for deletion in "${deletions[@]}"; do
            test -z "$(git ls-remote --heads origin "${deletion#:}")"
          done
      - name: Report cleanup status
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=gamelingo/branch-cleanup -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
