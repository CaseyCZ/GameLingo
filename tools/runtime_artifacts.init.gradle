// Read only the app's resolved runtime artifacts, not Gradle's global cache.
import groovy.json.JsonOutput
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Missing app project')
    app.tasks.register('gameLingoRuntimeArtifacts') {
        doLast {
            def artifacts = app.configurations.getByName('debugRuntimeClasspath')
                .resolvedConfiguration.resolvedArtifacts
            def records = artifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                [coordinate: "${id.group}:${id.name}:${id.version}".toString(),
                 name: artifact.file.name, file: artifact.file.absolutePath]
            }.sort { a, b -> (a.coordinate <=> b.coordinate) ?: (a.name <=> b.name) }
            if (records.isEmpty()) throw new GradleException('No runtime artifacts resolved')
            def output = app.layout.buildDirectory.file('gamelingo-runtime-artifacts.json').get().asFile
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(records))
        }
    }
}
